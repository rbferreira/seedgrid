<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#047857" />
    <title>SeedGrid</title>
    <script>
      // Applies the theme before the first paint, avoiding a flash (backlog #10). Mirrors
      // readThemePref + resolveTheme in src/lib/theme.ts: keep the two in sync. No choice saved
      // = follow the operating system; data-theme always gets the resolved "light" or "dark".
      (function () {
        var pref = "system";
        try {
          var saved = localStorage.getItem("sg-theme");
          if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
        } catch (e) {}
        var dark = true;
        try {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        document.documentElement.dataset.theme = pref === "system" ? (dark ? "dark" : "light") : pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
