# SeedGrid — Alertmanager. Routes all alerts by metric to a webhook in the
# Control Plane, which persists them as SeedGrid alerts (shown in the Portal).
route:
  receiver: seedgrid-cp
  group_by: ["alertname", "instance"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: seedgrid-cp
    webhook_configs:
      # Internal Control Plane endpoint (seedgrid-core network). send_resolved=true
      # so the CP also resolves the alert when the condition normalizes.
      - url: http://seedgrid-controller:8080/api/v1/integrations/alertmanager
        send_resolved: true
        # Shared secret for internal webhooks (#116); the file is generated by the
        # scripts/bootstrap-controller.sh in deploy/observability/secrets/ (gitignored).
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/integration-token
