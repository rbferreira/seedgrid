# SeedGrid — Observability (Prometheus + node-exporter).
# ADR-016: Grafana was removed; visualization is the Portal's responsibility
# (Control Plane queries Prometheus and exposes /api/v1/metrics/...). Prometheus
# scrapes the controller (seedgrid-core network) and the node-exporters on the hosts.
#
# Usage (on the Control Plane host): docker compose up -d
#
# Security (fix/c1-observability-bind-localhost):
#   Prometheus and Alertmanager map ports only to 127.0.0.1 — inaccessible
#   from the LAN. Node Exporter listens on the seedgrid-core network gateway (172.18.0.1),
#   reachable by Prometheus within the same network but unreachable from the LAN
#   (the LAN has no route to the Docker network, 172.18.0.0/16).

name: seedgrid-observability

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: seedgrid-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
      # Seed Node targets written by the Control Plane (file_sd, ADR-017).
      - prom-targets:/etc/prometheus/targets:ro
    networks:
      - seedgrid-core   # so the controller can reach seedgrid-prometheus:9090
      - observability
    ports:
      # Bind only to 127.0.0.1 — no network exposure.
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: seedgrid-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Internal webhooks token (#116), generated by scripts/bootstrap-controller.sh (gitignored).
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    networks:
      - seedgrid-core   # to send webhooks to seedgrid-controller:8080
      - observability
    ports:
      # Bind only to 127.0.0.1 — no network exposure.
      - "127.0.0.1:9093:9093"

  # Hardware/OS metrics from the Control Plane host. network_mode host → exposes :9100
  # on the CT itself. Listens on the seedgrid-core network gateway (172.18.0.1),
  # accessible by Prometheus (same network) but unreachable from the LAN.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: seedgrid-node-exporter
    restart: unless-stopped
    # procfs/sysfs point to the host's own /proc. When the host itself is a
    # system container with a virtualized /proc, without this the node-exporter reads the /proc
    # of the physical machine and all its containers report identical metrics.
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--web.listen-address=172.18.0.1:9100"
    network_mode: host
    pid: host
    volumes:
      - "/:/host:ro,rslave"

networks:
  seedgrid-core:
    name: seedgrid-core
    external: true
    # Fixed subnet to ensure the gateway (172.18.0.1) never changes between
    # network recreations. Node Exporter listens on this IP.
    ipam:
      config:
        - subnet: 172.18.0.0/16
  observability:
    name: seedgrid-observability

volumes:
  prometheus-data:
    name: seedgrid-prometheus-data
  alertmanager-data:
    name: seedgrid-alertmanager-data
  # Shared with the Control Plane (which writes the targets). External to exist
  # across both compose projects: docker volume create seedgrid-prom-targets
  prom-targets:
    name: seedgrid-prom-targets
    external: true
