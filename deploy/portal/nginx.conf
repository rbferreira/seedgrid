# SeedGrid Portal — nginx serves the SPA (static Vite build) and proxies the API
# to the Control Plane on the same origin (no CORS). The Portal only talks to the API.

# Rate limit for login (A3): 5 attempts/minute per IP, burst of 3.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security headers (A4).
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    root /usr/share/nginx/html;
    index index.html;

    # Local content publishing (ADR-019/ADR-020): the upload is the ENTIRE FILE
    # (potentially GBs), not a .torrent. No body limit and NO buffering — the
    # nginx streams it to the controller, which in turn streams it to the Node. Without
    # this dedicated route, the 5m limit on /api/ would drop the upload with a 413.
    location = /api/v1/torrents/create {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;
        proxy_pass http://seedgrid-controller:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content download via the Portal (backlog #1): the response is the ENTIRE FILE
    # (GBs) that the controller streams from the Node. proxy_buffering off = passes to the browser
    # without buffering to disk; large timeouts for long downloads. Authenticated by the
    # ticket in the query (the browser doesn't send the Bearer in a navigation/anchor).
    location = /api/v1/torrents/download {
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://seedgrid-controller:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login: rate limit of 5 req/min per IP (A3). Blocks brute force.
    location = /api/v1/auth/login {
        client_max_body_size 1m;
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://seedgrid-controller:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent Channel (ADR-012/014): the Agent talks to the CP HERE, and no longer on
    # the 8080 exposed on the LAN (M2/#11 — the port now only listens on 127.0.0.1 on the CT).
    #
    # Own body limit: `extract_screenshots` (ADR-026) returns the frames as
    # **base64 in the command result**, and 4 JPEGs from a 1080p video easily exceed the
    # 5m on /api/ — with the general limit, the publishing form would break with a 413 as soon
    # as the Agent stopped talking directly on 8080. No rate limit: the callers are the
    # fleet (polling every 5s), not a human on a login form.
    location /api/v1/agent/ {
        client_max_body_size 64m;
        proxy_pass http://seedgrid-controller:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API and health: proxy to the controller on the compose internal network.
    location /api/ {
        # .torrent upload: season packs exceed the default 1 MB of nginx (→ 413).
        # Matches the API limit (io.LimitReader 5 MB in handleAddTorrent).
        client_max_body_size 5m;
        proxy_pass http://seedgrid-controller:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://seedgrid-controller:8080/healthz;
    }

    # Assets with hash in the name (Vite) are immutable: long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Seed Node onboarding artifacts (ADR-017): script + ARM64 binary.
    # Served as raw files (do not fall into the SPA); 404 if missing.
    location /node/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA: any unknown route falls back to index.html (client-side routing).
    # index.html is NEVER cached — this way the browser always fetches the current bundle
    # (avoids serving an old version after deployment).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
